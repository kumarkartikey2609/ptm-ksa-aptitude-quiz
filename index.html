<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PTM KSA Aptitude Test</title>
<style>
  :root {
    --purple: #6b46c1;
    --purple-dark: #4c2d8c;
    --green: #1a8754;
    --red: #d64545;
    --bg: #f5f4fa;
    --card: #ffffff;
    --border: #e2dff0;
    --text: #262133;
    --muted: #6b6478;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 24px 16px 80px;
  }
  .header {
    background: var(--purple);
    color: #fff;
    padding: 20px 16px;
    text-align: center;
  }
  .header h1 {
    margin: 0 0 4px;
    font-size: 20px;
  }
  .header p {
    margin: 0;
    font-size: 13px;
    opacity: 0.85;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 16px;
  }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 6px;
    color: var(--muted);
  }
  input[type="text"], input[type="tel"], input[type="date"], textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 15px;
    margin-bottom: 16px;
    font-family: inherit;
  }
  textarea {
    resize: vertical;
    min-height: 90px;
  }
  .btn {
    display: inline-block;
    background: var(--purple);
    color: #fff;
    border: none;
    padding: 12px 24px;
    border-radius: 6px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
  }
  .btn:hover { background: var(--purple-dark); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .q-num {
    font-size: 12px;
    font-weight: 700;
    color: var(--purple);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 6px;
  }
  .q-text {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 12px;
    line-height: 1.4;
  }
  .opt {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    margin-bottom: 8px;
    cursor: pointer;
    font-size: 14px;
    line-height: 1.4;
  }
  .opt:hover { background: #faf9fd; }
  .opt.selected {
    border-color: var(--purple);
    background: #f2eefb;
  }
  .opt input { margin-top: 2px; }
  #timer {
    position: sticky;
    top: 0;
    z-index: 10;
    background: #fff8e6;
    border-bottom: 1px solid #f0dca0;
    padding: 8px 16px;
    text-align: center;
    font-size: 13px;
    font-weight: 600;
    color: #8a6416;
  }
  .progress-bar {
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 20px;
  }
  .progress-fill {
    height: 100%;
    background: var(--purple);
    transition: width 0.2s;
  }
  .result-card {
    text-align: center;
    padding: 40px 20px;
  }
  .result-score {
    font-size: 48px;
    font-weight: 800;
    margin: 8px 0;
  }
  .pass { color: var(--green); }
  .fail { color: var(--red); }
  .result-msg {
    font-size: 15px;
    color: var(--muted);
    margin-top: 8px;
    line-height: 1.5;
  }
  .hidden { display: none !important; }
  .error {
    color: var(--red);
    font-size: 13px;
    margin-top: -8px;
    margin-bottom: 12px;
  }
  .loading {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
  }
  .unanswered-note {
    font-size: 13px;
    color: var(--red);
    margin-bottom: 12px;
    text-align: center;
  }
</style>
</head>
<body>

<div class="header">
  <h1>PTM KSA Aptitude Test</h1>
  <p>Training center use only. Do not share this link outside a supervised session.</p>
</div>

<div class="wrap">

  <!-- SCREEN 1: Candidate details -->
  <div id="screen-start" class="card">
    <label for="f-agency">Agency Name *</label>
    <input type="text" id="f-agency" placeholder="Enter the agency name">
    <label for="f-idate">Interview Date *</label>
    <input type="date" id="f-idate">
    <label for="f-name">Full Name *</label>
    <input type="text" id="f-name" placeholder="Enter your full name">
    <label for="f-dob">Date of Birth *</label>
    <input type="date" id="f-dob">
    <label for="f-city">Interview City *</label>
    <input type="text" id="f-city" placeholder="Enter the interview city">
    <label for="f-passport">Passport Number</label>
    <input type="text" id="f-passport" placeholder="Enter your passport number">
    <label for="f-region">Province / City / Region *</label>
    <input type="text" id="f-region" placeholder="Enter your province, city or region">
    <label for="f-experience">Past Working Experience (Mention your last 5 years experience in detail) *</label>
    <textarea id="f-experience" placeholder="Describe your work experience over the last 5 years in detail"></textarea>
    <label for="f-education">Educational Background *</label>
    <textarea id="f-education" placeholder="Describe your educational background"></textarea>
    <div id="start-error" class="error hidden"></div>
    <button class="btn" id="btn-start">Start Test</button>
  </div>

  <!-- SCREEN 2: Loading -->
  <div id="screen-loading" class="loading hidden">Loading your questions…</div>

  <!-- SCREEN 3: Quiz -->
  <div id="screen-quiz" class="hidden">
    <div id="timer">Time remaining: 20:00</div>
    <div class="wrap" style="padding-top:16px;">
      <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
      <div id="questions-container"></div>
      <div id="unanswered-note" class="unanswered-note hidden">Please answer all questions before submitting.</div>
      <button class="btn" id="btn-submit">Submit Test</button>
    </div>
  </div>

  <!-- SCREEN 4: Result -->
  <div id="screen-result" class="card result-card hidden">
    <div id="result-icon" style="font-size:40px;">🙏</div>
    <div id="result-label" style="font-size:18px;font-weight:700;">Thank you for giving the test</div>
    <div class="result-msg" id="result-msg">A result will be shared
